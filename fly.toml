# Fly.io (optional). Create app with: fly launch --no-deploy
app = "smartarch-net"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3847"
  HOSTNAME = "0.0.0.0"
  DATA_DIR = "/data"
  DATABASE_URL = "file:/data/smartarch.db"

[http_service]
  internal_port = 3847
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "smartarch_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
